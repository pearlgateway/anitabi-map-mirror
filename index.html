<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anitabi 动画巡礼地图镜像</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#map { width: 100vw; height: 100vh; }
.sidebar { position: fixed; top: 0; left: 0; width: 320px; height: 100vh; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); z-index: 1000; display: flex; flex-direction: column; box-shadow: 2px 0 12px rgba(0,0,0,0.15); transition: transform 0.3s; }
.sidebar.collapsed { transform: translateX(-100%); }
.toggle-btn { position: fixed; top: 12px; left: 332px; z-index: 1001; width: 36px; height: 36px; border: none; border-radius: 8px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.15); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: left 0.3s; }
.toggle-btn.collapsed { left: 12px; }
.header { padding: 16px; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; }
.header h1 { font-size: 16px; color: #333; margin-bottom: 4px; }
.header p { font-size: 12px; color: #888; }
.search-box { padding: 12px 16px; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; }
.search-box input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
.search-box input:focus { border-color: #4a90d9; }
.bangumi-list { flex: 1; overflow-y: auto; padding: 8px; }
.bangumi-item { display: flex; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s; margin-bottom: 2px; }
.bangumi-item:hover { background: #f0f4f8; }
.bangumi-item.active { background: #e3eef7; }
.bangumi-item .color-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
.bangumi-item .info { flex: 1; min-width: 0; }
.bangumi-item .name { font-size: 13px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bangumi-item .meta { font-size: 11px; color: #999; margin-top: 2px; }
.bangumi-item .count { font-size: 11px; color: #4a90d9; font-weight: 600; margin-left: 6px; flex-shrink: 0; }
.popup-content { min-width: 200px; max-width: 280px; }
.popup-content img { width: 100%; border-radius: 6px; margin-bottom: 8px; display: block; }
.popup-content h3 { font-size: 14px; margin-bottom: 4px; color: #333; }
.popup-content p { font-size: 12px; color: #666; margin-bottom: 2px; }
.popup-content .ep { font-size: 11px; color: #999; }
.stats-bar { padding: 8px 16px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; font-size: 12px; color: #666; flex-shrink: 0; }
.leaflet-popup-content-wrapper { border-radius: 10px; }
.leaflet-popup-content { margin: 12px; }
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="header"><h1>Anitabi 动画巡礼地图</h1><p>镜像站点 | 数据来源 anitabi.cn</p></div>
  <div class="stats-bar" id="statsBar">加载中...</div>
  <div class="search-box"><input type="text" id="searchInput" placeholder="搜索作品..." oninput="filterBangumi()"></div>
  <div class="bangumi-list" id="bangumiList"></div>
</div>
<button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">&#9776;</button>
<div id="map"></div>
<script>
const DATA_CHUNKS = 10;
let map, markersLayer, allBangumis = [], allMarkers = [], bangumiLayers = {};

async function loadData() {
  const parts = await Promise.all(
    Array.from({length: DATA_CHUNKS}, (_, i) => fetch(`data_${i}.js`).then(r => r.text()))
  );
  const allStrings = [];
  for (const part of parts) {
    const matches = part.match(/"([^"]*)"/g);
    if (matches) allStrings.push(...matches.map(m => m.slice(1, -1)));
  }
  const b64 = allStrings.join('');
  const binary = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Response(binary).body.pipeThrough(new DecompressionStream("gzip"));
  const text = await new Response(stream).text();
  return JSON.parse(text);
}

async function init() {
  map = L.map("map").setView([35.6762, 139.6503], 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OSM contributors", maxZoom: 19 }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
  try {
    const data = await loadData();
    allBangumis = data.bangumis; allMarkers = data.markers;
    renderBangumiList(allBangumis); addMarkers(allMarkers);
    updateStats(allMarkers.length, allBangumis.length);
  } catch (e) { document.getElementById("statsBar").textContent = "加载失败: "+e.message; console.error(e); }
}

function addMarkers(markers) {
  markersLayer.clearLayers();
  const grouped = {};
  for (const m of markers) { const k = `${m.bid}`; if (!grouped[k]) grouped[k]=[]; grouped[k].push(m); }
  for (const [bid, pts] of Object.entries(grouped)) {
    const bg = allBangumis.find(b => b.id == bid);
    const color = bg?.color || "#ff4444";
    const lg = L.layerGroup();
    for (const pt of pts) {
      lg.addLayer(L.circleMarker([pt.lat, pt.lng], { radius: 6, fillColor: color, color: "#fff", weight: 1.5, opacity: 0.9, fillOpacity: 0.8 }).bindPopup(createPopup(pt, bg)));
    }
    lg.addTo(markersLayer); bangumiLayers[bid] = lg;
  }
}

function createPopup(pt, bg) {
  const img = pt.image ? `<img src="${pt.image}" loading="lazy" alt="${pt.cn || pt.name}">` : "";
  const title = pt.cn || pt.name || "未知地标";
  const sub = pt.name && pt.cn !== pt.name ? `<p>${pt.name}</p>` : "";
  const bn = bg ? `<p>作品：${bg.cn || bg.title}</p>` : "";
  const ep = pt.ep ? `<span class="ep">第${pt.ep}集 ${pt.s ? Math.floor(pt.s/60)+":"+(pt.s%60).toString().padStart(2,"0") : ""}</span>` : "";
  return `<div class="popup-content">${img}<h3>${title}</h3>${sub}${bn}${ep}</div>`;
}

function renderBangumiList(list) {
  const c = document.getElementById("bangumiList"); c.innerHTML = "";
  for (const bg of list) {
    const el = document.createElement("div"); el.className = "bangumi-item";
    el.dataset.bid = bg.id; el.onclick = () => selectBangumi(bg.id);
    el.innerHTML = `<div class="color-dot" style="background:${bg.color}"></div><div class="info"><div class="name">${bg.cn || bg.title || bg.id}</div><div class="meta">${bg.city || ""} ${bg.pointsLength}个地标</div></div><div class="count">${bg.pointsLength}</div>`;
    c.appendChild(el);
  }
}

function selectBangumi(bid) {
  const items = document.querySelectorAll(".bangumi-item");
  const clicked = document.querySelector(`.bangumi-item[data-bid="${bid}"]`);
  const isActive = clicked?.classList.contains("active");
  items.forEach(i => i.classList.remove("active"));
  if (isActive) { markersLayer.clearLayers(); for (const l of Object.values(bangumiLayers)) l.addTo(markersLayer); return; }
  clicked?.classList.add("active"); markersLayer.clearLayers();
  if (bangumiLayers[bid]) { bangumiLayers[bid].addTo(markersLayer); const bg = allBangumis.find(b=>b.id==bid); if (bg?.geo) map.setView([bg.geo[0], bg.geo[1]], bg.zoom || 13); }
}

function filterBangumi() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  if (!q) { renderBangumiList(allBangumis); return; }
  renderBangumiList(allBangumis.filter(bg => (bg.cn && bg.cn.toLowerCase().includes(q)) || (bg.title && bg.title.toLowerCase().includes(q)) || (bg.city && bg.city.includes(q))));
}

function updateStats(mc, bc) { document.getElementById("statsBar").textContent = `${bc} 部作品 | ${mc} 个地标`; }
function toggleSidebar() { document.getElementById("sidebar").classList.toggle("collapsed"); document.getElementById("toggleBtn").classList.toggle("collapsed"); }
init();
</script>
</body>
</html>
